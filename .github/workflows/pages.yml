name: GitHub Pages (manual or one approved tag)
# Branch pushes do not trigger deployment. Do not create the tag before approval.
on:
  push:
    tags:
      - pages-retry-approved-1
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter DEPLOY_PAGES after explicit deployment approval'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/tags/pages-retry-approved-1' && github.event.deleted != true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/story-design-system' && inputs.confirmation == 'DEPLOY_PAGES')
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.approval.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate trigger, approved commit and branch ancestry
        id: approval
        shell: bash
        env:
          APPROVED_SHA: ${{ vars.PAGES_APPROVED_SHA }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse 'HEAD^{commit}')
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF" == "refs/tags/pages-retry-approved-1" ]] || exit 1
            if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ || "$revision" != "$APPROVED_SHA" ]]; then
              echo "::error::Tag commit must match the separately approved PAGES_APPROVED_SHA repository variable."
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/story-design-system" && "$CONFIRMATION" == "DEPLOY_PAGES" ]] || exit 1
          else
            exit 1
          fi
          git show-ref --verify refs/remotes/origin/story-design-system
          if ! git merge-base --is-ancestor "$revision" refs/remotes/origin/story-design-system; then
            echo "::error::Deployment commit is not in story-design-system history."
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:content
      - run: npm run build
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pages
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages
  deploy:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

name: GitHub Pages (manual approval only)
# No push/pull_request trigger. This file alone never publishes on push.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter DEPLOY_PAGES after explicit deployment approval'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/story-design-system' && inputs.confirmation == 'DEPLOY_PAGES'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:content
      - run: npm run build
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pages
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
